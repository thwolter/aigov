[tasks.check]
workspace = false
command = "cargo"
args = ["check"]

[tasks.install]
workspace = false
command = "cargo"
args = ["install", "--path", "crates/aigov", "--root", "${HOME}/.local"]

[tasks.test]
workspace = false
command = "cargo"
args = ["test"]

[tasks.ci]
workspace = false
dependencies = ["fmt", "clippy", "test"]

[tasks.fmt]
workspace = false
command = "cargo"
args = ["fmt"]

[tasks.clippy]
workspace = false
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]
