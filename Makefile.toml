[tasks.check]
workspace = false
command = "cargo"
args = ["check"]

[tasks.install]
workspace = false
command = "cargo"
toolchain = "stable"
args = ["install", "--path", "crates/aigov", "--root", "${HOME}/.local"]

[tasks.test]
workspace = false
command = "cargo"
args = ["test"]

[tasks.ci]
workspace = false
dependencies = ["fmt", "clippy", "test"]

[tasks.fmt]
workspace = false
command = "cargo"
args = ["fmt"]

[tasks.clippy]
workspace = false
command = "cargo"
args = ["clippy", "--", "-D", "warnings"]

[tasks.build-windows]
workspace = false
script = '''
cargo build -r --target x86_64-pc-windows-gnu
mkdir -p dist
cp target/x86_64-pc-windows-gnu/release/aigov.exe dist/aigov.exe
git add dist/aigov.exe
'''

[tasks.build-mac]
workspace = false
script = '''
cargo build -r
mkdir -p dist
cp target/release/aigov dist/aigov
git add dist/aigov
'''