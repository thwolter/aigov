    provenance: ai-suggested
    content: "For an injection-only experiment, the policy prompt should explicitly preserve the primary task, exclude the control block from summarization, and place one exact human-review notice requirement at the end."
    context: "The current Add-the-following-paragraph wording leaves the output contract ambiguous and mixes policy metadata with response text."
