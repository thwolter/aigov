    content: "For a file-only input, use input as the internal role name and FILE as the user-facing metavar; use PATH only when both files and directories are accepted, DIR for directories, and avoid FILEPATH."
    context: "The current shared FileCommand field is filepath and renders as FILEPATH, while output metavariables vary between OUTPUT and PATH."
