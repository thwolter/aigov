    provenance: ai-suggested
    content: "The aigov CLI should be a deterministic document-processing layer around LLM workflows: extract structured inputs before model use and validate, sanitize, or verify artifacts after model use."
    context: "User requested a cross-format command roadmap whose features must outperform asking an LLM directly on speed, safety, or cleanliness."
