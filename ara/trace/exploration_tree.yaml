tree:
  - id: N01
    type: experiment
    title: "DOCX policy injection round trip"
    provenance: ai-executed
    timestamp: "2026-08-11T08:02"
    result: >
      The focused test initially returned None because the writer emitted only the
      AI prompt while the reader expected an aigov:policy JSON payload. Writing the
      serialized payload before the prompt made the round-trip test pass.
    evidence: ["cargo test injects_and_reads_ai_policy"]
    status: resolved
  - id: N02
    type: decision
    title: "DOCX injection stores prompt only"
    provenance: user
    timestamp: "2026-08-11T08:02"
    choice: "Remove serialized policy metadata and test hidden prompt injection only."
    alternatives: ["Embed an aigov:policy JSON payload"]
    evidence: [N01]
    status: resolved
  - id: N03
    type: decision
    title: "Mark prompt-only policy for lifecycle operations"
    provenance: user
    timestamp: "2026-08-11T08:18"
    choice: >
      Prefix the hidden prompt with aigov:policy and provide detection, update,
      and removal operations without serializing AiPolicy fields.
    alternatives: ["Unmarked prompt", "Serialized policy payload"]
    evidence: [N02]
    status: resolved
  - id: N04
    type: experiment
    title: "DOCX policy lifecycle verification"
    provenance: ai-executed
    timestamp: "2026-08-11T08:18"
    result: >
      Injection, marker detection, atomic replacement, removal, library tests,
      doctests, and cargo check passed. The full binary suite still has the
      unrelated LibreOffice PDF SIGABRT failure.
    evidence: ["cargo test --lib", "cargo test --doc", "cargo check"]
    status: resolved
  - id: N05
    type: decision
    title: "Move XML construction into policy codec"
    provenance: user
    timestamp: "2026-08-11T09:04"
    choice: "Have policy functions accept raw XML and own Reader and Writer construction."
    alternatives: ["Construct Reader and Writer in DocxDocument"]
    evidence: [O01]
    status: resolved
  - id: N06
    type: experiment
    title: "Policy codec boundary verification"
    provenance: ai-executed
    timestamp: "2026-08-11T09:04"
    result: "All 30 library tests, 10 doctests, cargo check, and diff whitespace checks passed."
    evidence: ["cargo test --lib", "cargo test --doc", "cargo check", "git diff --check"]
    status: resolved
  - id: N07
    type: question
    title: "CLI policy preset representation"
    provenance: user
    timestamp: "2026-08-11T09:41"
    description: "How should clap ValueEnum variants select prespecified AiPolicy values?"
    status: open
  - id: N08
    type: decision
    title: "Rename and expand CLI policy presets"
    provenance: user
    timestamp: "2026-08-11T09:47"
    choice: "Rename the policy selection enum and provide additional predefined policies."
    alternatives: ["Keep the weak/strong enum unchanged"]
    evidence: [N07]
    status: resolved
  - id: N09
    type: question
    title: "Policy lifecycle CLI design"
    provenance: user
    timestamp: "2026-08-11T10:17"
    description: "How should policy injection, update, removal, and validation be exposed in the CLI?"
    status: open
  - id: N10
    type: experiment
    title: "DOCX policy removal and reinjection placement"
    provenance: ai-executed
    timestamp: "2026-08-11T13:11"
    result: >
      A focused regression confirmed that inject, remove, then inject reproduces
      identical document XML and places the hidden policy paragraph immediately
      before body-level section properties. Both policy tests passed; the full
      library suite passed, while the unrelated LibreOffice PDF test still
      aborted with SIGABRT.
    evidence: ["cargo test formats::docx::policy::tests", "cargo test"]
    status: resolved
  - id: N11
    type: question
    title: "Stronger DOCX prompt-injection probe"
    provenance: user
    timestamp: "2026-08-11T16:56"
    description: >
      How should hidden policy injection be sharpened into a stronger test document
      so an LLM document reader can be hardened against prompt injection?
    status: open
  - id: N12
    type: experiment
    title: "Governing policy interpreted as document content"
    provenance: user
    timestamp: "2026-08-11T17:10"
    result: >
      The LLM summarized the hidden aigov policy block and its behavioral constraints
      instead of producing the ordinary document summary followed by the required
      human-review notice.
    evidence: ["user-provided LLM output"]
    status: resolved
  - id: N13
    type: pivot
    title: "Return from canary probe to governing policy"
    provenance: user
    timestamp: "2026-08-11T17:10"
    from: "Exact-output prompt-injection canary"
    to: "Document governance policy requiring normal summary plus human-review notice"
    trigger: "The desired test is realistic persistent governance behavior rather than a fixed-output canary."
    status: resolved
  - id: N14
    type: experiment
    title: "Task-preserving policy excludes itself but omits notice"
    provenance: user
    timestamp: "2026-08-11T17:26"
    result: >
      The LLM summarized only the two ordinary document statements and explicitly
      excluded the processing instructions as non-substantive content, but did not
      append the requested human-review notice.
    evidence: ["user-provided LLM output", "src/office/policy.rs"]
    status: resolved
  - id: N15
    type: question
    title: "Policy marker visibility"
    provenance: user
    timestamp: "2026-08-11T17:31"
    description: "Should the textual aigov:policy prefix be removed to improve injected-policy adherence?"
    status: open
  - id: N16
    type: decision
    title: "Honor policy injection output path"
    provenance: user
    timestamp: "2026-08-11T17:45"
    choice: "Policy injection must save the modified document to the output path supplied to the inject subcommand."
    alternatives: ["Always overwrite the input document"]
    evidence: ["src/cli/policy.rs"]
    status: resolved
  - id: N17
    type: experiment
    title: "Policy injection output routing verification"
    provenance: ai-executed
    timestamp: "2026-08-11T17:45"
    result: >
      Moving output-path resolution outside the Inject match arm eliminated variable
      shadowing. Both policy CLI tests passed, and an end-to-end command created the
      requested output DOCX containing the injected processing-control block.
    evidence: ["cargo test --bin aigov cli::policy::tests", "cargo run --quiet -- data/test.docx policy inject --output /tmp/aigov-policy-output-test.docx --preset standard"]
    status: resolved
  - id: N18
    type: experiment
    title: "Policy prefix removal"
    provenance: user
    timestamp: "2026-08-11T17:53"
    result: "Removing the textual POLICY_PREFIX produced no observable change in the LLM response."
    evidence: ["user-reported A/B result"]
    status: resolved
  - id: N19
    type: dead_end
    title: "Textual prefix as primary rejection cue"
    provenance: user
    timestamp: "2026-08-11T17:53"
    hypothesis: "The aigov:policy prefix materially causes the LLM to classify and reject the governing instruction block."
    failure_mode: "Removing the prefix did not change model behavior."
    lesson: "Restore the lifecycle marker and focus subsequent tests on instruction semantics and the reader/model trust boundary."
    status: resolved
  - id: N20
    type: question
    title: "Format-neutral CLI command roadmap"
    provenance: user
    timestamp: "2026-08-11T19:28"
    description: >
      Which additional commands should aigov expose across Office formats when each
      command must be faster, safer, or cleaner than performing the task through an LLM?
    status: open
  - id: N21
    type: experiment
    title: "Command-first metadata argument parsing"
    provenance: ai-executed
    timestamp: "2026-08-12T08:30"
    result: >
      Removing the obsolete root filepath and using metadata-owned FileCommand
      paths made the editable-fields parser test pass with one filepath.
    evidence: ["cargo test metadata_set_accepts_editable_fields_only"]
    status: resolved
  - id: N22
    type: question
    title: "Missing filepath CLI behavior"
    provenance: user
    timestamp: "2026-08-12T08:33"
    description: "Should aigov replace clap's standard missing-required-filepath error with custom handling?"
    status: open
  - id: N23
    type: dead_end
    title: "Field-level help setting"
    provenance: user
    timestamp: "2026-08-12T08:37"
    hypothesis: "Combining subcommand and arg_required_else_help on MetadataArgs.command changes missing filepath behavior for unzip."
    failure_mode: "The setting targets the nested metadata field, not the outer FileCommand-based unzip command."
    lesson: "Apply command settings to the command container that owns the missing argument."
    status: resolved
  - id: N24
    type: experiment
    title: "Borrow metadata command payloads"
    provenance: ai-executed
    timestamp: "2026-08-12T08:41"
    result: >
      Matching MetadataCommand by reference allowed boxed SetArgs and ShowArgs
      to dereference-coerce into the borrowed handler parameters. The focused
      parser test and cargo check passed.
    evidence: ["cargo test metadata_set_accepts_editable_fields_only", "cargo check"]
    status: resolved
  - id: N25
    type: question
    title: "CLI file and output argument placement"
    provenance: user
    timestamp: "2026-08-15T17:08"
    description: >
      Should input paths and --output appear in root help when only selected
      commands use them, and should the input be named filepath or input?
    status: open
  - id: N26
    type: experiment
    title: "CLI help convention comparison"
    provenance: ai-executed
    timestamp: "2026-08-15T17:08"
    result: >
      Generated aigov help and installed Git, Cargo, ripgrep, sips, textutil,
      plutil, mdls, and ditto help were compared with current Clap, Git, Cargo,
      Docker, Pandoc, GNU, and Apple documentation. Command-tree tools keep
      file operands on the owning command, while single-purpose tools commonly
      accept files at the root. The aigov root already omits file and output,
      but leaf help uses FILEPATH and inconsistent OUTPUT or PATH metavariables;
      PDF output is actually a directory, and Markdown help claims stdout while
      the implementation derives and writes a sibling .md file.
    evidence:
      - "cargo run -q -- --help and per-command --help"
      - "git -h, cargo help, rg --help, sips --help, textutil -help, plutil -help, mdls, ditto"
      - "https://docs.rs/clap/latest/clap/_derive/_tutorial/index.html"
      - "https://git-scm.com/docs/git-archive"
      - "https://doc.rust-lang.org/cargo/commands/cargo.html"
      - "https://docs.docker.com/reference/cli/docker/container/cp/"
      - "https://pandoc.org/MANUAL.html"
      - "https://www.gnu.org/prep/standards/html_node/Command_002dLine-Interfaces"
    status: resolved
