[package]
name = "aigov"
version = "0.1.0"
edition = "2024"
description = "Tools and a Rust library for inspecting and modifying OOXML Office documents."
readme = "README.md"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
quick-xml = "0.41.0"
thiserror = "2.0.19"
zip = "8.6.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
file-format = { version = "0.29.0", features = ["reader-zip"] }
tempfile = "3.27.0"
undoc = "0.8.0"
indicatif = "0.18.6"
